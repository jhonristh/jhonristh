name: Update Contribution Signal Trail

on:
  push:
    paths:
      - ".github/workflows/snake.yml"
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: profile-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution signal trail
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7fe6a0&color_dots=#10151c,#1c3326,#2f5c3f,#4d9e6a,#7fe6a0

      - name: Commit generated trail
        run: |
          git config user.name "jan-os-bot"
          git config user.email "actions@github.com"
          git add dist/github-snake-dark.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh contribution signal trail"
            git pull --rebase
            git push
          fi
