<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b0"/>
      <stop offset="60%" stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .bg { fill: #05070a; }
    .ring { fill: none; stroke: #1c2730; stroke-width: 1; }
    .label { font-family: 'Courier New', monospace; font-size: 13px; fill: #9fb3ad; }
    .sublabel { font-family: 'Courier New', monospace; font-size: 10px; fill: #5a6b63; }
    .core { font-family: 'Courier New', monospace; font-size: 12px; fill: #ffe9b0; font-weight: bold; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { r: 26; }
      50% { r: 30; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
    }
  </style>
  <rect class="bg" width="900" height="420"/>

  <!-- Three rings represent the product hierarchy below. -->
  <circle class="ring" cx="370" cy="200" r="62"/>
  <circle class="ring" cx="370" cy="200" r="118"/>
  <circle class="ring" cx="370" cy="200" r="174"/>

  <!-- sun / core -->
  <circle cx="370" cy="200" r="34" fill="url(#sunGlow)"/>
  <circle class="pulse" cx="370" cy="200" r="20" fill="#ffcf7a"/>
  <text x="370" y="204" text-anchor="middle" class="core">JAN CORE</text>

  <!-- Tier 01: flagship builds -->
  <circle r="5" fill="#ffe07a">
    <animateMotion dur="8s" repeatCount="indefinite" path="M 432,200 A 62,62 0 1 1 308,200 A 62,62 0 1 1 432,200"/>
  </circle>

  <!-- Tier 02: focused tools -->
  <circle r="6" fill="#7fd1ff">
    <animateMotion dur="13s" repeatCount="indefinite" path="M 488,200 A 118,118 0 1 1 252,200 A 118,118 0 1 1 488,200"/>
  </circle>

  <!-- Tier 03: planned navigation experiments -->
  <circle r="6" fill="#9fb3ad">
    <animateMotion dur="18s" repeatCount="indefinite" path="M 544,200 A 174,174 0 1 1 196,200 A 174,174 0 1 1 544,200"/>
  </circle>

  <text x="610" y="150" class="label">01 · FLAGSHIP</text>
  <text x="610" y="170" class="sublabel">BUSINA · RelAI · ECE Basics</text>
  <text x="610" y="210" class="label">02 · TOOLS</text>
  <text x="610" y="230" class="sublabel">I-ASCII · ESG · GabayNegosyo · E-Chest</text>
  <text x="610" y="270" class="label">03 · IN PROGRESS</text>
  <text x="610" y="290" class="sublabel">Auto News Digest</text>

  <text x="450" y="395" text-anchor="middle" class="sublabel">SOFTWARE MISSION NAVIGATION — PRODUCT PRIORITY MAP</text>
</svg>
